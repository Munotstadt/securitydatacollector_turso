name: Collect Fund Data (Top Holdings, Fundamentals, Asset Allocation)

on:
  schedule:
    # Weekly, Sunday 06:15 UTC — fund composition data changes slowly,
    # no need for the intraday cadence used by the price collectors.
    - cron: "15 6 * * 0"
  workflow_dispatch: {}   # allows manual "Run workflow" trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scripts/collect_fund_data.py
