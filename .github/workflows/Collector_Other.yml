name: Yahoo Collector (Collector_Other)
on:
  schedule:
    # 2x täglich: 07:22 UTC und 19:22 UTC
    - cron: '22 7 * * *'
    - cron: '22 19 * * *'
  workflow_dispatch: {}
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Run collector
        run: python scripts/collect_other.py
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
